name: Build Android app

# Runs on GitHub's own servers, which have the full Android SDK available -
# this is what actually compiles the real, installable .apk that can't be
# built in a plain sandbox with no Android SDK access. Nothing on your end
# needs Android Studio installed for this to work.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # adds a manual "Run workflow" button in the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Sync web assets into the native Android project
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Always builds - no secrets required. This is a debug-signed APK,
      # perfectly real and installable on any Android phone (enable
      # "install from unknown sources" for the one install), just not
      # eligible for the Play Store, which requires a release build signed
      # with your own key (the next step).
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: query-academy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Release build - only runs once you've added the 4 secrets below in
      # your repo's Settings -> Secrets and variables -> Actions. See
      # ANDROID_RELEASE_SETUP.md for exactly how to generate a signing key
      # and what to put in each secret. Until then this step is skipped
      # automatically (not failed) - the debug APK above still builds fine.
      - name: Check for release-signing secrets
        id: check_signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write keystore.properties and decode signing key
        if: steps.check_signing.outputs.has_signing == 'true'
        working-directory: android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.jks
          cat > keystore.properties << EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK + AAB
        if: steps.check_signing.outputs.has_signing == 'true'
        working-directory: android
        run: |
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Upload signed release APK
        if: steps.check_signing.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: query-academy-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release AAB (what the Play Store actually wants)
        if: steps.check_signing.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: query-academy-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab